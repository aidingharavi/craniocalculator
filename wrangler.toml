# Cloudflare Worker configuration for craniocalc.com
# Static files are served from ./public; /api/* is handled by worker/index.js.
# "name" must match the Worker's name in the Cloudflare dashboard.
name = "craniocalculator"
main = "worker/index.js"
compatibility_date = "2026-10-01"

# Custom domains: created automatically on deploy (the zone must be active in this Cloudflare account).
routes = [
  { pattern = "craniocalc.com", custom_domain = true },
  { pattern = "www.craniocalc.com", custom_domain = true },
]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"

# Form storage (collaboration messages and digest sign-ups).
# Until these are set, the forms show a friendly "email us instead" message.
# 1. Cloudflare dashboard > Storage & Databases > KV > Create namespace: RATE_LIMIT, then SUBMISSIONS
# 2. Paste each namespace ID below and remove the leading "# " from those lines.
# [[kv_namespaces]]
# binding = "RATE_LIMIT"
# id = "PASTE_RATE_LIMIT_ID"
#
# [[kv_namespaces]]
# binding = "SUBMISSIONS"
# id = "PASTE_SUBMISSIONS_ID"

# Secrets: set in the Cloudflare dashboard (Worker > Settings > Variables and Secrets), never here:
#   ADMIN_TOKEN         for /api/admin/export
#   RATE_SALT           any random string
#   RESEND_API_KEY, NOTIFY_EMAIL, NOTIFY_FROM   optional email alerts for collaboration messages
#
# The weekly research digest runs on GitHub Actions, so its keys (ANTHROPIC_API_KEY,
# NCBI_API_KEY, NCBI_EMAIL) go in GitHub repository secrets, not here.
