name: Weekly digest

on:
  schedule:
    # Mondays at 13:17 UTC (7:17 AM Central in winter, 8:17 AM in summer)
    - cron: "17 13 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
        run: node scripts/digest.mjs

      - name: Commit digest
        run: |
          git config user.name "craniocalc digest bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/digest public/research.xml
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Weekly digest $(date -u +%Y-%m-%d)"
            git push
          fi
